name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the toolchain the project is developed on
  # (Flutter 3.47.9 ships Dart 3.13.7, which pubspec.yaml requires).
  FLUTTER_VERSION: "3.47.9"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The analysis package is pure Dart. Its fixtures are committed, so no
      # Python is needed here (see packages/cohabit_analysis/tool).
      - name: Analysis package analyze and tests
        working-directory: packages/cohabit_analysis
        run: |
          dart pub get
          dart analyze
          dart test

      # Golden images are pixel-exact and were generated on macOS; the
      # painter tests that sample pixels still run here.
      - name: Test
        run: flutter test --exclude-tags golden

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: cohabit-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
